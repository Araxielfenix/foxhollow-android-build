// app/build.gradle - Configuración nativa completa
plugins {
    id 'com.android.application'
}

// Toolchain used by the native build. aurora is compiled against NDK 27 because its
// libc++ gates std::jthread / std::stop_token behind _LIBCPP_ENABLE_EXPERIMENTAL, which we
// pass through CMAKE_CXX_FLAGS below.
def fhNdkVersion = "27.2.12479018"

// Rust host toolchain. nod (the DVD/filesystem backend) is built from source through Corrosion,
// and the default toolchain on this machine has no linker for host build scripts, so the GNU
// toolchain is selected explicitly and its bundled dlltool is put on PATH by the caller.
// The triple and the executable suffix are host-specific so CI on Linux resolves the toolchain too.
def fhHostIsWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def fhRustTriple = fhHostIsWindows ? 'stable-x86_64-pc-windows-gnu' : 'stable-x86_64-unknown-linux-gnu'
def fhRustExe = fhHostIsWindows ? '.exe' : ''
def rustToolchain = "${System.getProperty('user.home')}/.rustup/toolchains/${fhRustTriple}/bin"

android {
    namespace 'dev.encounter.foxhollow'
    compileSdk 34
    ndkVersion fhNdkVersion

    defaultConfig {
        applicationId "dev.encounter.foxhollow"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.testrunner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_PLATFORM=android-24',
                          '-DCMAKE_BUILD_TYPE=RelWithDebInfo',
                          // libc++ hides std::jthread / std::stop_token behind this until the
                          // experimental set is enabled; aurora/lib/thread.hpp needs both.
                          '-DCMAKE_C_FLAGS=-D_LIBCPP_ENABLE_EXPERIMENTAL',
                          '-DCMAKE_CXX_FLAGS=-D_LIBCPP_ENABLE_EXPERIMENTAL',
                          '-DFOXHOLLOW_STATIC_JPEG=ON',
                            // aurora pulls zstd with find_package / pkg-config first and only falls
                            // back to FetchContent when neither finds it. CI images ship a host zstd
                            // that pkg-config resolves to paths under the NDK sysroot, so the header
                            // is never found and the FetchContent fallback is skipped. Turning the
                            // cache compression off is deterministic on every host; the local build
                            // keeps the compressed cache unless FOXHOLLOW_DISABLE_ZSTD is set.
                            "-DAURORA_CACHE_USE_ZSTD=${(System.getenv('FOXHOLLOW_DISABLE_ZSTD') ?: '0') == '1' ? 'OFF' : 'ON'}",
                          "-DJPEG_INCLUDE_DIR=${rootDir}/third_party/jpeg-turbo-arm64/include",
                          "-DJPEG_LIBRARY=${rootDir}/third_party/jpeg-turbo-arm64/lib/libjpeg.a",
"-DRust_COMPILER=${rustToolchain}/rustc${fhRustExe}",
                            "-DRust_CARGO=${rustToolchain}/cargo${fhRustExe}",
                            "-DCORROSION_CARGO=${rustToolchain}/cargo${fhRustExe}"
                cFlags '-O2'
                cppFlags '-O2', '-std=c++20'
                targets 'foxhollow', 'png_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            // The port builds Aurora, Borealis, nod, SDL3 and the game itself from the
            // repository root; app/src/main/cpp only ever held the stub experiment.
            path file("${rootDir}/CMakeLists.txt")
            version '3.31.6'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // SDL3's org.libsdl.app classes are fetched into the CMake binary tree during the native
    // build. That tree lives under app/.cxx/<buildType>/<hash>/<abi>, and the hash is not stable
    // across machines, so stageSdlJava globs for it and copies the sources into a fixed generated
    // directory that the source set points at. Aurora's own Android surface class is shipped in
    // this module instead, so Aurora's platforms/android/java is deliberately not added here.
    sourceSets {
        main {
            java.srcDirs += ["${layout.buildDirectory.get()}/generated/sdl/java"]
        }
    }
}

def nativeCxxDir = file("${rootDir}/app/.cxx")

// org.libsdl.app is not a Gradle target, so nothing would compile it without this copy.
def stageSdlJava = tasks.register('stageSdlJava', Copy) {
    description 'Copies the SDL3 Android Java classes out of the CMake tree so they can be compiled.'
    dependsOn 'configureCMakeRelWithDebInfo[arm64-v8a]'
    // Changing the CMake arguments produces a new <hash> directory under .cxx while the old one
    // is still around, so the same classes can be matched more than once.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(fileTree(dir: nativeCxxDir,
        includes: ['**/_deps/sdl-src/android-project/app/src/main/java/org/libsdl/app/*.java'])) {
        // Flatten: fileTree keeps the path relative to app/.cxx, which would bury the classes
        // under RelWithDebInfo/<hash>/... and break the package layout.
        it.eachFile { f -> f.path = f.name }
    }
    into layout.buildDirectory.dir('generated/sdl/java/org/libsdl/app')
}

// Hooked onto javac rather than preBuild: the CMake configure task already depends on
// preBuild (via preReleaseBuild), so depending on it from preBuild would be a cycle.
// configureEach keeps this lazy, since the javac task is not registered yet at this point.
tasks.withType(JavaCompile).configureEach {
    dependsOn stageSdlJava
}

// aurora's PNG dependency builds a shared libpng16 that libfoxhollow.so links against. It is not
// a dependency of the foxhollow target, so it has to be listed as an extra CMake target (see
// externalNativeBuild arguments above) or Gradle never builds it. Stage it next to the other
// jniLibs before packaging, reading it from the same CMake tree the native build populates.
def stageExtraJniLibs = tasks.register('stageExtraJniLibs', Copy) {
    from(fileTree(dir: nativeCxxDir, includes: ['**/libpng16.so'], excludes: ['**/CMakeFiles/**']))
    // Flatten: only the .so should land here, never a copy of the native build tree.
    eachFile { it.path = it.name }
    includeEmptyDirs = false
    into layout.projectDirectory.dir('src/main/jniLibs/arm64-v8a')
}

tasks.named('preBuild').configure {
    dependsOn stageExtraJniLibs
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
