name: Foxhollow Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'local.properties') }}
          restore-keys: |
            gradle-

      - name: Setup Android SDK and NDK
        uses: nttld/setup-android-ndk@v1
        with:
          ndk-version: 26.1.10909125
          cmake-version: 3.22.1
          api-level: 34
          cache: true

      - name: Verify NDK
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK"
          ls "$ANDROID_NDK/build/cmake/"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -Pandroid.defaultConfig.ndk.abiFilters=arm64-v8a \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.daemon=false

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foxhollow-debug-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30